name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=low
      - run: npm run test:import
      - run: npm run test:tools
      - run: npm run test:news
      - run: npm run test:statutes
      - run: npm run test:editorial
      - run: npm run editorial:queue
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/judgments/index.html && test -f dist/404.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:publishing
        env:
          RR_TEST_BROWSER: '1'

  windows-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=low
      - run: npm run test:editorial
      - run: npm run build
